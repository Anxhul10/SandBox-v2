name: next build
on: 
  push:
    paths:
      - 'apps/nextjs-dashboard/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: repo
        uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: install
        run: pnpm install
        working-directory: apps/nextjs-dashboard
      - name: build
        run: pnpm build
        working-directory: apps/nextjs-dashboard

  